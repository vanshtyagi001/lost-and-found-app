<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Briefcase Top Handle -->
  <path d="M 48 26 L 48 20 C 48 15, 52 13, 58 13 L 70 13 C 76 13, 80 15, 80 20 L 80 26" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Briefcase Main Body -->
  <rect x="16" y="26" width="96" height="70" rx="12" fill="#2563eb" />

  <!-- Horizontal Accent Seam -->
  <line x1="16" y1="54" x2="112" y2="54" stroke="#ffffff" stroke-width="4" stroke-opacity="0.75" />

  <!-- Question Mark on Briefcase -->
  <path d="M 38 42 C 38 35, 50 35, 50 41 C 50 46, 44 48, 44 54" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="44" cy="62" r="2.5" fill="#ffffff" />

  <!-- Magnifying Glass Lens with White Cutout -->
  <circle cx="86" cy="80" r="23" fill="#ffffff" stroke="#0f172a" stroke-width="7" />

  <!-- Magnifying Glass Handle -->
  <line x1="102" y1="96" x2="118" y2="112" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />

  <!-- Recovered Checkmark inside Search Lens -->
  <path d="M 78 80 L 84 86 L 94 74" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
