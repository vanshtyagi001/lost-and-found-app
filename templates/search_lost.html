{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 class="h3 fw-bold text-main mb-2">Search for Your Lost Item</h2>
        <p class="text-muted mb-4">Upload a photo of your lost item or a similar reference image to match against reported items.</p>

        <form id="searchLostForm" method="POST" enctype="multipart/form-data" action="{{ url_for('search_lost') }}">
            <div class="mb-3">
                <label for="item_image" class="form-label fw-semibold">Lost Item Image (or reference)*</label>
                <input type="file" class="form-control" id="item_image" name="item_image" accept="image/*" required>
                
                <!-- Image Preview -->
                <div id="image_preview_container" class="mt-2 d-none">
                    <div class="d-flex align-items-center gap-3 p-2 bg-white border rounded">
                        <img id="image_preview" src="#" alt="Selected item preview" style="width: 72px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0;">
                        <div class="flex-grow-1 text-truncate">
                            <div id="image_preview_name" class="fw-semibold small text-truncate"></div>
                            <div id="image_preview_size" class="text-muted small"></div>
                        </div>
                        <button type="button" id="remove_image_btn" class="btn btn-sm btn-outline-secondary" title="Remove selected image">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="item_type" class="form-label fw-semibold">Item Type*</label>
                <select class="form-select" id="item_type" name="item_type" required>
                    <option value="" disabled selected>Select item type...</option>
                    {% for type in item_types %}
                        <option value="{{ type }}">{{ type }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="color" class="form-label fw-semibold">Color</label>
                    <input type="text" class="form-control" id="color" name="color" placeholder="e.g., Black, Red, Gold">
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label for="brand" class="form-label fw-semibold">Brand (if applicable)</label>
                    <input type="text" class="form-control" id="brand" name="brand" placeholder="e.g., Samsung, Fossil, Jansport">
                </div>
            </div>

            <div class="mb-3">
                <label for="location" class="form-label fw-semibold">Last Known Location*</label>
                <input type="text" class="form-control" id="location" name="location" placeholder="e.g., Main Street Cafe, City Bus Route 5" required>
            </div>

            <div class="mb-4">
                <label for="contact_info_search" class="form-label fw-semibold">Your Contact Information (Optional)</label>
                <input type="text" class="form-control" id="contact_info_search" name="contact_info_search" placeholder="Optional: email@example.com">
                <div class="form-text text-muted">Optional reference for your search session.</div>
            </div>

            <!-- Submit Button Area -->
            <div id="searchSubmitArea">
                <button type="submit" id="searchSubmitBtn" class="btn btn-dark px-4 py-2" data-no-spinner="true">
                    <i class="bi bi-search me-1"></i> Search for Matches
                </button>
            </div>

            <!-- Dynamic Search Progress Bar -->
            <div id="searchProgressBox" class="card border p-3 mt-3 d-none shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="d-flex align-items-center gap-2">
                        <span class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></span>
                        <span id="progressStatusText" class="fw-semibold text-main small">Uploading image...</span>
                    </div>
                    <span id="progressPercentText" class="fw-bold text-primary small">0%</span>
                </div>

                <!-- Progress Bar Track -->
                <div class="progress" style="height: 8px;">
                    <div id="searchProgressBar" 
                         class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
                         role="progressbar" 
                         style="width: 0%;" 
                         aria-valuenow="0" 
                         aria-valuemin="0" 
                         aria-valuemax="100">
                    </div>
                </div>

                <!-- Step Info & Detail Note -->
                <div class="d-flex justify-content-between text-muted mt-2" style="font-size: 0.775rem;">
                    <span>Step <span id="progressStepNum" class="fw-semibold text-main">1</span> of 4</span>
                    <span id="progressDetailText">Preparing search request...</span>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Search Progress Bar Script -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('searchLostForm');
    var progressBox = document.getElementById('searchProgressBox');
    var progressBar = document.getElementById('searchProgressBar');
    var percentText = document.getElementById('progressPercentText');
    var statusText = document.getElementById('progressStatusText');
    var stepNum = document.getElementById('progressStepNum');
    var detailText = document.getElementById('progressDetailText');
    var submitBtn = document.getElementById('searchSubmitBtn');

    if (!form || !progressBox) return;

    form.addEventListener('submit', function (e) {
        if (!form.checkValidity()) {
            return;
        }

        // Show progress box and disable submit button to prevent double-submit
        progressBox.classList.remove('d-none');
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.classList.add('disabled');
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Processing Search...';
        }

        var currentPercent = 0;
        var targetPercent = 95; // Steady progression up to 95% until server loads results page

        var stages = [
            { threshold: 25, step: 1, status: "Uploading image...", detail: "Transferring photograph to server" },
            { threshold: 55, step: 2, status: "Analyzing visual features...", detail: "Extracting color, material & physical attributes" },
            { threshold: 80, step: 3, status: "Scanning database records...", detail: "Filtering category & location candidates" },
            { threshold: 95, step: 4, status: "Evaluating match scores...", detail: "Computing final confidence percentages" }
        ];

        var interval = setInterval(function () {
            if (currentPercent < targetPercent) {
                // Calibrated pacing: fast initially, gently easing as it approaches 95%
                var increment;
                if (currentPercent < 30) {
                    increment = 1.4;
                } else if (currentPercent < 60) {
                    increment = 0.9;
                } else if (currentPercent < 85) {
                    increment = 0.5;
                } else {
                    increment = 0.2;
                }

                currentPercent = Math.min(targetPercent, currentPercent + increment);
                var rounded = Math.floor(currentPercent);

                progressBar.style.width = rounded + '%';
                progressBar.setAttribute('aria-valuenow', rounded);
                percentText.textContent = rounded + '%';

                // Update stage details
                for (var i = 0; i < stages.length; i++) {
                    if (rounded <= stages[i].threshold) {
                        statusText.textContent = stages[i].status;
                        stepNum.textContent = stages[i].step;
                        detailText.textContent = stages[i].detail;
                        break;
                    }
                }
            } else {
                clearInterval(interval);
            }
        }, 65);
    });
});
</script>
{% endblock %}
