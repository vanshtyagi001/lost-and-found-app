{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-4 my-md-5">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card border shadow-sm p-4">
            <!-- Header Icon & Title -->
            <div class="text-center mb-4">
                <div class="admin-auth-icon mx-auto mb-3">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h1 class="h4 fw-bold text-main mb-1">Admin Portal</h1>
                <p class="text-muted small mb-0">Sign in to moderate and inspect system records</p>
            </div>

            <!-- Login Form -->
            <form method="POST" action="{{ url_for('admin_login', next=request.args.get('next')) }}">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-main">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" 
                               class="form-control border-start-0 ps-0" 
                               id="username" 
                               name="username" 
                               value="{{ entered_username or '' }}" 
                               placeholder="Enter admin username"
                               autocomplete="username"
                               required 
                               autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-main">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password" 
                               class="form-control border-start-0 border-end-0 ps-0" 
                               id="password" 
                               name="password" 
                               placeholder="Enter admin password"
                               autocomplete="current-password"
                               required>
                        <button type="button" 
                                class="btn btn-outline-secondary border-start-0 bg-light text-muted" 
                                id="togglePasswordBtn" 
                                tabindex="-1"
                                title="Show/Hide Password"
                                onclick="togglePasswordVisibility()">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                </button>

                <div class="text-center">
                    <a href="{{ url_for('index') }}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Back to Homepage
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const icon = document.getElementById('togglePasswordIcon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        passwordInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>
{% endblock %}
