{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-4 my-md-5">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card border shadow-sm p-4 p-sm-5" style="border-radius: 12px;">
            <!-- Header Title -->
            <div class="text-center mb-4">
                <h1 class="h4 fw-bold text-main mb-1">Admin Portal</h1>
                <p class="text-muted small mb-0">Sign in to moderate and inspect system records</p>
            </div>

            <!-- Login Form -->
            <form method="POST" action="{{ url_for('admin_login', next=request.args.get('next')) }}">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-main mb-1">Username</label>
                    <input type="text" 
                           class="form-control" 
                           id="username" 
                           name="username" 
                           value="{{ entered_username or '' }}" 
                           placeholder="Enter admin username"
                           autocomplete="username"
                           required 
                           autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-main mb-1">Password</label>
                    <div class="position-relative">
                        <input type="password" 
                               class="form-control pe-5" 
                               id="password" 
                               name="password" 
                               placeholder="Enter admin password"
                               autocomplete="current-password"
                               required>
                        <button type="button" 
                                class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted text-decoration-none px-3" 
                                id="togglePasswordBtn" 
                                tabindex="-1"
                                title="Show or hide password"
                                onclick="togglePasswordVisibility()">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                </button>

                <div class="text-center">
                    <a href="{{ url_for('index') }}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Back to Homepage
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const icon = document.getElementById('togglePasswordIcon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        passwordInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>
{% endblock %}
